<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"

   <style>
    body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 0;
    }

    #content-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0; /* Important for flex children */
    }

    .container-fluid {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        align-items: center;
    }

    .section-mainCard {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .main-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-height: 95%;
    }

    .content-row {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: visible; 
    }

    form {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    fieldset {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }
     .form-card{
        height: 100%;
     }
    @media(max-width:500px) {
        .main-card{
           max-height: 82%;
        }
     }
</style>
</head>

<body id="page-top" style="background-color:rgba(254, 248, 232, 1);">
    <!-- Content Wrapper -->
    <div id="content-wrapper">
        <!-- Main Content -->
        <header class="header">
            <div class="navbar-area">
                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light topbar mb-2 static-top   justify-content-between"
                    style="height:100px">

                </nav>
            </div>
        </header>
        <main class="main-container container-fluid" style="height: auto;">
             <div class="row justify-content-center w-100 h-100">

                                <div class="row py-2 align-items-center">

                                            </div>
                                        </a>

                                </div>
                            </div>
                            <div class="col-md-12" style="flex: 1;min-height: 0;">

                                       <div class="col-md-11 h-100 d-flex">
                                        <form class="d-flex align-items-center w-100">
                                            <fieldset class="w-100">
                                                <div class="form-card  px-lg-4 py-lg-4 ">
                                                    <div class="row data-row">
                                                        <div class="col-auto">
                                                            <p id="feed-number"> رقم التغذية </p>
                                                        </div>
                                                        <div class="col-auto personal-data">
                                                            <p> 23-1-62-5001-000003</p>

                                                        </div>
                                                    </div>
                                                    <div class="row data-row">
                                                        <div class="col-auto">
                                                            <p id="feed-number"> المُغذي</p>

                                                        </div>
                                                        <div class="col-auto personal-data">
                                                            <p> محمود سعد الكشغري</p>

                                                        </div>
                                                    </div>
                                                    <div class="row data-row">
                                                        <div class="col-auto">
                                                            <p id="feed-number"> التاريخ</p>

                                                        </div>
                                                        <div class="col-auto personal-data">
                                                            <p>2023/01/05</p>

                                                        </div>
                                                    </div>
                                                    <div class="row data-row">
                                                        <div class="col-auto">
                                                            <p id="feed-number"> المبلغ</p>

                                                        </div>
                                                        <div class="col-auto personal-data">
                                                            <p> 1950.00</p>

                                                        </div>
                                                    </div>

                                                        <div class="col-auto">
                                                            <label id="notes" class="mb-lg-0">الملاحظات</label>
                                                        </div>
                                                        <div class="col d-flex justify-content-end ">
                                                            <textarea class="form-control textarea-inputs" rows="1"
                                                                maxlength="100" name="notes"></textarea>
                                                        </div>
                                                    </div>
                                                    <div class="row data-row text-end">
                                                        <div class="col-md-6">

                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="row w-100 py-2 g-2 " style="min-height: 61px;">
                                                    <div class="col-auto d-flex align-items-center p-md-0">

                                                        </button>
                                                    </div>
                                                    <div class="col-auto d-flex align-items-center">
                                                        <button type="button" class="btn btn-secondary px-5"
                                                            data-bs-dismiss="modal">رفض</button>
                                                    </div>
                                                </div>
                                            </fieldset>

                                </div>

                    </path>
                </svg>
            </div>

        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"

</html>
